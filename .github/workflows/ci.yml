name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - name: Check out ibl-datoviz
        uses: actions/checkout@v6

      # The synthetic mesh and region fixtures are versioned with the matching
      # ibl-anatomy revision, while the large D070 asset set is deliberately
      # not part of CI.
      - name: Check out synthetic atlas fixtures
        uses: actions/checkout@v6
        with:
          repository: int-brain-lab/ibl-anatomy
          ref: c66486c7f38f0751848dde0f12a718c8d49e81aa
          path: ibl-anatomy-checkout

      - name: Place atlas fixtures beside the repository
        run: mv "$GITHUB_WORKSPACE/ibl-anatomy-checkout" "$GITHUB_WORKSPACE/../ibl-anatomy"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.8.x'
          enable-cache: true

      - name: Resolve the pinned source snapshot normally
        run: uv sync --group dev --locked

      - name: Report installed distributions
        run: uv run --frozen python -c "from importlib.metadata import version; print('ibl-datoviz', version('ibl-datoviz')); print('ibl-anatomy', version('ibl-anatomy')); print('datoviz', version('datoviz'))"

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Unit and synthetic fixture tests
        run: uv run --frozen pytest -q

      - name: Build documentation in strict mode
        run: uv run --frozen --with-requirements docs/requirements.txt mkdocs build --strict

      - name: Run synthetic gallery smoke
        shell: bash
        run: |
          set +e
          output=$(mktemp)
          uv run --frozen python tools/build_gallery.py \
            --example atlas-spike \
            --fixture-root "$GITHUB_WORKSPACE/../ibl-anatomy/tests/fixtures" \
            --output-root "$GITHUB_WORKSPACE/build/ci-gallery" \
            >"$output" 2>&1
          status=$?
          cat "$output"
          if [ "$status" -eq 0 ]; then
            test -s "$GITHUB_WORKSPACE/build/ci-gallery/atlas-spike.png"
          elif grep -Eq 'dvz_app\(\) failed|Unable to load libdatoviz' "$output"; then
            echo '::warning::Datoviz native runtime or GPU context unavailable; gallery smoke skipped.'
          else
            exit "$status"
          fi
