[project]
name = "ibl_datoviz"
version = "0.2.0.dev0"
description = "Datoviz v0.4 visualization components for IBL atlas data"
authors = [
    {name = "International Brain Laboratory", email = "software-devs@internationalbrainlab.org"},
]

requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "datoviz>=0.4.0rc2,<0.5",
    "ibl-atlas-assets>=0.0.0",
    "numpy>=1.24",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
# Immutable revisions define the spike. Adjacent source checkouts may override via PYTHONPATH.
datoviz = { git = "https://github.com/datoviz/datoviz.git", rev = "d9064facf6da9de5df7df1503f99479413b56eeb" }
ibl-atlas-assets = { git = "https://github.com/int-brain-lab/ibl-atlas-assets.git", rev = "8dd56e878b6147bb26616b92eecb8bf8ce9738f1" }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12.10",
]

[tool.ruff]
line-length = 99
include = ["pyproject.toml", "ibl_datoviz/**/*.py", "examples/**/*.py", "tests/**/*.py"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
ignore = [
  "D100",    # Missing docstring in public module
  "D104",    # Missing docstring in public package
  "PLR2004", # Magic value used in comparison
  "PLR0913", # Too many arguments
]

select = [
  "A",    # flake8-builtins
  "B",    # flake8-bugbear
  "ICN",  # flake8-import-conventions
  "LOG",  # flake8-logging
  "PIE",  # flake8-pie
  "SIM",  # flake8-simplify
  "TID",  # flake8-tidy-imports
  "TC",   # flake8-type-checking
  "E",    # pycodestyle Error
  "W",    # pycodestyle Warning
  "F",    # Pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "PL",   # pylint
  "UP",   # pyupgrade
  "D",    # pydocstyle
  "FURB", # refurb
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"] # pydocstyle

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["ibl*"]
