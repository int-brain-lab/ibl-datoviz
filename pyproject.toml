[project]
name = "ibl_datoviz"
version = "0.1.0"
description = "IBL datoviz package for visualizing data"
authors = [
    {name = "International Brain Laboratory", email = "software-devs@internationalbrainlab.org"},
]

requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "datoviz",
    "iblatlas",
    "iblutil",
    "mapbox-earcut",
    "numpy",
    "ONE-api",
    "rtree", # needed for splitting meshes into hemispheres using trimesh # needed for splitting meshes into hemispheres using trimesh
    "shapely",
    "trimesh",
]

[project.optional-dependencies]
# Optional install instructions for PyQt6
qt = [
    "pyqt6>=6.10.2"
]
## Optional install instructions for datoviz development version
#datoviz_dev = [
#    "datoviz @ file://${DATOVIZ_PATH}"
#]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

#[tool.uv.sources]
#datoviz = { path = "vendor/datoviz", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.12.10",
]
lint = ["ruff>=0.9.2"]

[tool.ruff]
line-length = 99
include = ["pyproject.toml", "ibl_alignment_gui/**/*.py", "tests/**/*.py"]
exclude = ["ibl_alignment_gui/utils/qt/adapted_axis.py", "ibl_alignment_gui/plugins/*.py"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
ignore = [
  "D100",    # Missing docstring in public module
  "D104",    # Missing docstring in public package
  "PLR2004", # Magic value used in comparison
  "PLR0913", # Too many arguments
]

select = [
  "A",    # flake8-builtins
  "B",    # flake8-bugbear
  "ICN",  # flake8-import-conventions
  "LOG",  # flake8-logging
  "PIE",  # flake8-pie
  "SIM",  # flake8-simplify
  "TID",  # flake8-tidy-imports
  "TC",   # flake8-type-checking
  "E",    # pycodestyle Error
  "W",    # pycodestyle Warning
  "F",    # Pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "PL",   # pylint
  "UP",   # pyupgrade
  "D",    # pydocstyle
  "FURB", # refurb
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"] # pydocstyle

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["ibl*", "one*" ]
